name: Publish Python Package

on:
  release:
    types: [published]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test_and_build:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep 3.14.6 to cover HTMLParser behavior before the 3.14.7 change.
        python-version: ["3.14.6", "3.14", "3.15"]
    env:
      # Override the local development pin in .python-version.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          check-latest: true

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Lint
        run: uv run ruff check

      - name: Check formatting
        run: uv run ruff format --check

      - name: Check Markdown formatting
        run: npx prettier --check README.md "docs/**/*.md"

      - name: Type check with Pyright
        run: uv run pyright

      - name: Type check with Ty
        run: uv run ty check

      - name: Run tests
        run: uv run pytest -v

      - name: Build
        # One pure Python wheel works on every supported Python version.
        if: matrix.python-version == '3.14'
        run: uv build

      - name: Store the distribution packages
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@v7
        with:
          name: python-packages
          path: dist/

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test_and_build]
    environment: release
    permissions:
      id-token: write
    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@v8
        with:
          name: python-packages
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
